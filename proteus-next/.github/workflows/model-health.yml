name: Model Health Check

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health-check:
    name: Check Groq & Gemini Models
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: cd proteus-next && npm ci

      - name: Run model health check
        id: health
        run: cd proteus-next && node scripts/model-health.mjs
        continue-on-error: true

      - name: Commit changes if models were swapped
        if: steps.health.outcome == 'success'
        run: |
          git config user.name "proteus-bot"
          git config user.email "bot@proteus.app"
          git add proteus-next/models.json
          git diff --staged --quiet || git commit -m "chore: auto-update model health check [skip ci]"
          git push
